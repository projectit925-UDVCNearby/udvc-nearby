  <circle cx="24" cy="18.5" r="10.3" fill="url(#sun)"/>
  <!-- กาแลบนยอดหลังคา (ปลายโค้งออก) -->
  <!-- ตัวบ้าน -->
  <path d="M24 12.4 31.6 19.2h-2.2v5.9H18.6v-5.9h-2.2z" fill="#fff" stroke="#fff" stroke-width="1.1" stroke-linejoin="round"/>
  <rect x="22.3" y="20.4" width="3.4" height="4.7" rx="1" fill="#155E75"/>
  <!-- เส้นทาง: ตัดผ่านปลายหมุด มีขอบขาวแยกจากหมุด -->
  <path d="M3.5 42.6C11.5 37.4 31 34.4 44.5 39.6 31.5 37.6 15 39.4 3.5 42.6z" fill="#D9631E" stroke="#fff" stroke-width="1.4" stroke-linejoin="round" paint-order="stroke"/>
