<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- UDVC Nearby: หมุดแผนที่ + ดวงอาทิตย์อีสาน + บ้าน + เส้นทางสีส้ม -->
  <defs>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C8BA8"/>
      <stop offset="1" stop-color="#155E75"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F08A3C"/>
      <stop offset="1" stop-color="#D9631E"/>
    </linearGradient>
  </defs>
  <!-- หมุด -->
  <path d="M24 45.5S38.5 31.6 38.5 18.5a14.5 14.5 0 1 0-29 0C9.5 31.6 24 45.5 24 45.5z" fill="url(#pin)"/>
